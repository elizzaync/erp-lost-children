            <sc-if value="{{ modalCargo }}">
              <h3 style="font-size:20px; font-weight:600; margin:0 0 4px; color:#0e3d69;">{{ rxTitulo }}</h3>
              <p style="margin:0 0 18px; font-size:14px; color:#5b7185; line-height:1.5; text-wrap:pretty;">{{ rxLede }}</p>

              <sc-if value="{{ rxEsAlta }}">
                <div style="margin-bottom:18px;">
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Nombre del cargo</div>
                  <input type="text" value="{{ rxNombre }}" onChange="{{ onRxNombre }}" placeholder="Teen Leader" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
                  <div style="margin-top:6px; font-size:12.5px; color:#7d8e9c; text-wrap:pretty;">Si ya existe uno igual escrito de otra forma, se reutiliza en vez de duplicarlo.</div>
                </div>
              </sc-if>

              <sc-if value="{{ rxEditable }}">
                <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px;">
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Permisos por módulo</div>
                  <div style="display:flex; gap:12px;">
                    <button onClick="{{ rxNinguno }}" style="font-size:12px; color:#5b7185;" style-hover="color:#1462a5">Quitar todo</button>
                    <button onClick="{{ rxVista }}" style="font-size:12px; color:#5b7185;" style-hover="color:#1462a5">Todo en solo ver</button>
                  </div>
                </div>
              </sc-if>

              <div style="border:1px solid #e2ddd6; border-radius:3px; background:#ffffff;">
                <sc-for list="{{ rxGrupos }}" as="g" hint-placeholder-count="4">
                  <div>
                    <div style="padding:8px 14px; background:#f7f5f2; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:#5b7185; border-top:1px solid #efece8;">{{ g.nombre }}</div>
                    <sc-for list="{{ g.modulos }}" as="m" hint-placeholder-count="5">
                      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 14px; border-top:1px solid #f2efeb; flex-wrap:wrap;">
                        <div style="min-width:0; flex:1;">
                          <div style="font-size:14px; color:#201e1d;">{{ m.nombre }}</div>
                          <sc-if value="{{ m.nota }}">
                            <div style="font-size:12px; color:#a8321f; margin-top:2px;">{{ m.nota }}</div>
                          </sc-if>
                        </div>
                        <div style="display:flex; gap:2px; flex:none;">
                          <sc-for list="{{ m.opciones }}" as="o" hint-placeholder-count="3">
                            <button onClick="{{ o.elegir }}" style="{{ o.estilo }}">{{ o.label }}</button>
                          </sc-for>
                        </div>
                      </div>
                    </sc-for>
                  </div>
                </sc-for>
              </div>

              <sc-if value="{{ rxBloqueado }}">
                <div style="display:flex; align-items:flex-start; gap:10px; margin-top:16px; padding:12px 14px; background:#eef2f6; border-left:3px solid #8697a5; border-radius:2px;">
                  <i class="ph-duotone ph-lock-simple" style="font-size:17px; color:#5b7185; flex:none; margin-top:1px;"></i>
                  <div style="font-size:13px; color:#3c4a55; line-height:1.5; text-wrap:pretty;">{{ rxBloqueado }}</div>
                </div>
              </sc-if>
            </sc-if>
