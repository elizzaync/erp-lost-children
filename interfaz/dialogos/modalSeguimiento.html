            <sc-if value="{{ modalSeguimiento }}">
              <h3 style="font-size:20px; font-weight:600; margin:0 0 4px; color:#0e3d69;">Registrar seguimiento</h3>
              <p style="margin:0 0 20px; font-size:14px; color:#5b7185; text-wrap:pretty;">Queda en el expediente de <b>{{ seBenef }}</b>.</p>
              <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:16px;">
                <div>
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Fecha</div>
                  <input type="date" value="{{ sgFecha }}" onChange="{{ onSgFecha }}" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
                </div>
                <div>
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Tipo</div>
                  <input type="text" value="{{ sgTipo }}" onChange="{{ onSgTipo }}" placeholder="Psicológico, social, educativo…" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
                </div>
              </div>
              <div style="margin-top:18px;">
                <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Situación · obligatoria</div>
                <input type="text" value="{{ sgSituacion }}" onChange="{{ onSgSituacion }}" placeholder="Cómo está" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
              </div>
              <div style="margin-top:18px;">
                <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Acción acordada</div>
                <input type="text" value="{{ sgAccion }}" onChange="{{ onSgAccion }}" placeholder="Qué se va a hacer" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
              </div>
              <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:16px; margin-top:18px;">
                <div>
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Compromisos</div>
                  <input type="text" value="{{ sgCompromisos }}" onChange="{{ onSgCompromisos }}" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
                </div>
                <div>
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Próxima fecha</div>
                  <input type="date" value="{{ sgProxima }}" onChange="{{ onSgProxima }}" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
                </div>
              </div>
              <div style="display:flex; align-items:flex-start; gap:10px; margin-top:18px; padding:12px 14px; background:#fbf0d9; border-left:4px solid #e0a11c; border-radius:2px;">
                <i class="ph-duotone ph-shield-check" style="font-size:18px; color:#8a5c05; flex-shrink:0;"></i>
                <div style="font-size:13.5px; color:#8a5c05; text-wrap:pretty;">Lo que se escriba aquí es información sensible de un menor: lo justo para dar continuidad al acompañamiento.</div>
              </div>
            </sc-if>
