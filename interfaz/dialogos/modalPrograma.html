            <sc-if value="{{ modalPrograma }}">
              <h3 style="font-size:20px; font-weight:600; margin:0 0 4px; color:#0e3d69;">Registrar programa</h3>
              <p style="margin:0 0 20px; font-size:14px; color:#5b7185; text-wrap:pretty;">Queda en el expediente de <b>{{ seBenef }}</b>.</p>
              <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:16px;">
                <div>
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Programa</div>
                  <input type="text" value="{{ pgNombre }}" onChange="{{ onPgNombre }}" placeholder="Refuerzo escolar, taller de arte…" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
                </div>
                <div>
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Fecha de ingreso</div>
                  <input type="date" value="{{ pgDesde }}" onChange="{{ onPgDesde }}" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
                </div>
                <div>
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Fecha de salida</div>
                  <input type="date" value="{{ pgHasta }}" onChange="{{ onPgHasta }}" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
                </div>
              </div>
              <div style="margin-top:18px;">
                <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Nota</div>
                <input type="text" value="{{ pgNota }}" onChange="{{ onPgNota }}" placeholder="Opcional" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
              </div>
              <div style="font-size:13px; color:#7d8e9c; margin-top:9px; text-wrap:pretty;">Sin fecha de salida, el programa consta como en curso.</div>
            </sc-if>
