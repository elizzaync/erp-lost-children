            <sc-if value="{{ modalQuitarVinculo }}">
              <h3 style="font-size:20px; font-weight:600; margin:0 0 12px; color:#a8321f;">¿Quitar a {{ vinQuitarNombre }}?</h3>
              <div style="display:flex; align-items:flex-start; gap:11px; padding:14px 16px; background:#fbe7e3; border-left:4px solid #e2503c; border-radius:2px;">
                <i class="ph-duotone ph-warning-circle" style="font-size:22px; color:#a8321f; flex-shrink:0;"></i>
                <div style="font-size:14px; color:#7a2417; line-height:1.5; text-wrap:pretty;">Se retira el vínculo con este beneficiario. La ficha del responsable NO se borra, y sus vínculos con otros niños se quedan como están.</div>
              </div>
            </sc-if>
