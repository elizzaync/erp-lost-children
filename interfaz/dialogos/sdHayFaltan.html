            <sc-if value="{{ sdHayFaltan }}">
              <div style="margin-bottom:16px; padding:14px 16px; background:#fbf0d9; border-left:4px solid #e0a11c; border-radius:2px;">
                <div style="font-size:14.5px; font-weight:600; color:#8a5c05;">Faltan datos por completar</div>
                <p style="margin:6px 0 0; font-size:13.5px; color:#8a5c05; text-wrap:pretty;">Llénalos, o marca los que todavía no se saben. Marcar no inventa nada: el campo queda vacío y consta que se dejó así a propósito.</p>
                <div style="display:flex; flex-direction:column; gap:7px; margin-top:12px;">
                  <sc-for list="{{ sdFaltan }}" as="sd" hint-placeholder-count="4">
                    <label style="display:flex; align-items:center; gap:9px; font-size:14px; color:#3c4a55; cursor:pointer;">
                      <input type="checkbox" checked="{{ sd.marcado }}" onChange="{{ sd.alternar }}" style="width:16px; height:16px; flex:none;" />
                      <span style="font-weight:600;">{{ sd.etiqueta }}</span>
                      <span style="color:#8a5c05; font-size:13px;">sin dato por ahora</span>
                    </label>
                  </sc-for>
                </div>
              </div>
            </sc-if>
