            <sc-if value="{{ modalFormacion }}">
              <h3 style="font-size:20px; font-weight:600; margin:0 0 4px; color:#0e3d69;">Agregar formación</h3>
              <p style="margin:0 0 18px; font-size:14px; color:#5b7185; line-height:1.5; text-wrap:pretty;">Estudios, cursos o certificaciones. Los cursos van aquí mismo poniendo «curso» en el nivel: son la misma clase de dato.</p>
              <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:14px;">
                <div>
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Nivel</div>
                  <input type="text" value="{{ trNivel }}" onChange="{{ onTrNivel }}" placeholder="Universitario, técnico, curso…" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
                </div>
                <div>
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Institución</div>
                  <input type="text" value="{{ trInstitucion }}" onChange="{{ onTrInstitucion }}" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
                </div>
                <div>
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Carrera o tema</div>
                  <input type="text" value="{{ trCarrera }}" onChange="{{ onTrCarrera }}" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
                </div>
                <div>
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Grado obtenido</div>
                  <input type="text" value="{{ trGrado }}" onChange="{{ onTrGrado }}" placeholder="Bachiller, titulado, egresado" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
                </div>
                <div>
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Año de inicio</div>
                  <input type="text" value="{{ trDesde }}" onChange="{{ onTrDesde }}" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
                </div>
                <div>
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Año de fin</div>
                  <input type="text" value="{{ trHasta }}" onChange="{{ onTrHasta }}" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
                </div>
              </div>
              <div style="margin-top:16px;">
                <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Observaciones</div>
                <input type="text" value="{{ trNota }}" onChange="{{ onTrNota }}" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
              </div>
            </sc-if>
