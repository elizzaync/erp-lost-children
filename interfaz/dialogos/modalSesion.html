            <sc-if value="{{ modalSesion }}">
              <h3 style="font-size:20px; font-weight:600; margin:0 0 4px; color:#0e3d69;">Registrar sesión de acompañamiento</h3>
              <p style="margin:0 0 20px; font-size:14px; color:#5b7185; text-wrap:pretty;">Queda en el expediente de <b>{{ seBenef }}</b> y suma al contador de sesiones del año.</p>

              <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:16px;">
                <div>
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Fecha</div>
                  <input type="date" value="{{ seFecha }}" onChange="{{ onSeFecha }}" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
                </div>
                <div>
                  <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">La realizó</div>
                  <select value="{{ seQuien }}" onChange="{{ onSeQuien }}" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;">
                    <sc-for list="{{ sePersonas }}" as="sp" hint-placeholder-count="6">
                      <option value="{{ sp.valor }}">{{ sp.etiqueta }}</option>
                    </sc-for>
                  </select>
                </div>
              </div>

              <div style="margin-top:18px;">
                <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Tipo</div>
                <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:9px;">
                  <sc-for list="{{ seTipos }}" as="st" hint-placeholder-count="5">
                    <button onClick="{{ st.go }}" style="{{ st.style }}" style-hover="border-color:#1462a5">{{ st.label }}</button>
                  </sc-for>
                </div>
              </div>

              <div style="margin-top:18px;">
                <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c;">Notas</div>
                <input type="text" value="{{ seNotas }}" onChange="{{ onSeNotas }}" placeholder="Qué se trabajó en la sesión" style="width:100%; margin-top:7px; padding:9px 12px; background:#ffffff; border:1px solid #c9d4de; border-radius:2px; font-family:inherit; font-size:15px; color:#201e1d; outline:none;" />
              </div>

              <div style="display:flex; align-items:flex-start; gap:10px; margin-top:18px; padding:12px 14px; background:#fbf0d9; border-left:4px solid #d8a13a; border-radius:2px;">
                <i class="ph-duotone ph-shield-check" style="font-size:18px; color:#8a5c05; flex-shrink:0;"></i>
                <div style="font-size:13.5px; color:#8a5c05; text-wrap:pretty;">Las notas pueden contener información sensible del menor. Se guardan solo en esta base local; hoy no hay control de acceso por rol.</div>
              </div>
            </sc-if>
