<sc-if value="{{ isClave }}">
  <div style="min-height:100vh; background:#f4f3f1; display:flex; align-items:center; justify-content:center; padding:24px;">
    <div style="width:100%; max-width:430px; background:#ffffff; border:1px solid #e2ddd6; border-radius:3px; padding:34px 30px;">
      <div style="width:42px; height:42px; border-radius:2px; background:#e7eff7; display:flex; align-items:center; justify-content:center;">
        <i class="ph-duotone ph-key" style="font-size:22px; color:#1462a5;"></i>
      </div>
      <h1 style="margin:16px 0 0; font-size:23px; font-weight:700; color:#0e3d69; letter-spacing:-0.3px;">Elige tu contraseña</h1>
      <p style="margin:9px 0 0; font-size:14px; line-height:1.5; color:#5b7185; text-wrap:pretty;">
        Hola {{ clNombre }}. La contraseña con la que entraste te la asignó otra persona: cámbiala por una que solo sepas tú.
      </p>

      <div style="margin-top:24px;">
        <div style="margin-bottom:14px;">
          <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c; margin-bottom:7px;">Contraseña actual</div>
          <input type="password" value="{{ clAct }}" onChange="{{ onClAct }}" style="{{ clInput }}" />
        </div>
        <div style="margin-bottom:14px;">
          <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c; margin-bottom:7px;">Contraseña nueva</div>
          <input type="password" value="{{ clNueva }}" onChange="{{ onClNueva }}" style="{{ clInput }}" />
          <div style="margin-top:6px; font-size:12.5px; color:#7d8e9c;">{{ clMinimo }}</div>
        </div>
        <div style="margin-bottom:18px;">
          <div style="font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; color:#7d8e9c; margin-bottom:7px;">Repite la nueva</div>
          <input type="password" value="{{ clNueva2 }}" onChange="{{ onClNueva2 }}" onKeyDown="{{ onClKey }}" style="{{ clInput }}" />
        </div>

        <sc-if value="{{ clErr }}">
          <div style="display:flex; align-items:center; gap:9px; padding:11px 14px; background:#fbe7e3; border-left:4px solid #e2503c; border-radius:2px; margin-bottom:16px;">
            <i class="ph-duotone ph-warning-circle" style="font-size:19px; color:#a8321f;"></i>
            <span style="font-size:14px; color:#a8321f;">{{ clErr }}</span>
          </div>
        </sc-if>

        <button onClick="{{ guardarClave }}" style="{{ clBoton }}" style-hover="background:#0e3d69">
          <i class="ph-duotone ph-check" style="font-size:18px;"></i>{{ clBotonLabel }}
        </button>
        <button onClick="{{ doLogout }}" style="margin-top:12px; width:100%; padding:9px; font-size:13.5px; color:#7d8e9c;" style-hover="color:#1462a5">
          Salir sin cambiarla
        </button>
      </div>
    </div>
  </div>
</sc-if>
