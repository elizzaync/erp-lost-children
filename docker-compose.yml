# Despliegue en Coolify (Contabo).
#
# A diferencia del ERP anterior, este módulo NO necesita servidor de base de
# datos: usa SQLite, un archivo dentro de data/. Eso simplifica el despliegue
# pero traslada la responsabilidad al volumen: si data/ no persiste, cada
# redespliegue empieza con la base vacía.
#
# Ningún secreto va escrito aquí. Las variables ${...} se configuran en el
# panel de Coolify.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # Coolify enruta por dominio con su propio Traefik y termina el TLS ahí,
    # así que el contenedor solo expone HTTP en su puerto interno. Si en
    # cambio se accede por IP directa, descomentar el mapeo y elegir un puerto
    # que no choque con el 80/443 de Coolify.
    expose:
      - "7801"
    # ports:
    #   - "${PUBLIC_PORT:-8444}:7801"

    environment:
      # ── Terminal biométrico ───────────────────────────────────────────
      # Desde el 01/09/2026 la cuenta es propia, ya no compartida con el ERP
      # anterior. Sin estas variables la asistencia y el enrolamiento quedan
      # inactivos, pero el resto del sistema funciona: /api/health lo dice
      # en «configurado» y «faltan».
      #
      # YUNATT_BASE tiene que estar aquí. Faltaba, y el contenedor —que no
      # recibe backend/.env— se quedaba con el predeterminado de config.py,
      # que apuntaba al servidor caído. Ponerla en el panel no servía de
      # nada porque compose no la reenviaba.
      YUNATT_BASE: ${YUNATT_BASE:-http://www.yunatt.com:82}
      YUNATT_EMAIL: ${YUNATT_EMAIL}
      YUNATT_PASSWORD: ${YUNATT_PASSWORD}
      YUNATT_DEVICE_ID: ${YUNATT_DEVICE_ID}
      YUNATT_DEPT_ID: ${YUNATT_DEPT_ID}
      YUNATT_DEPT_NAME: ${YUNATT_DEPT_NAME:-RRHH-Nuevo}

      # ── Acceso ────────────────────────────────────────────────────────
      # El corte. Dejarlo en 0 hasta que Coolify sirva el dominio por HTTPS:
      # con login real y sin TLS, las contraseñas viajarían en claro. Una vez
      # el dominio tenga certificado, ponerlo en 1 desde el panel — no hace
      # falta tocar el código ni reconstruir la imagen.
      # 1 por defecto: el contenedor no recibe backend/.env (ver
      # .dockerignore), así que aquí es donde se decide de verdad.
      LOGIN_ESTRICTO: ${LOGIN_ESTRICTO:-1}
      # Marca la cookie de sesión como Secure: el navegador solo la manda
      # por HTTPS. Por defecto 1 —falla cerrado— porque una cookie de sesión
      # viajando en claro por la red de la casa es exactamente lo que no
      # puede pasar. Si alguna vez hace falta probar por IP sin certificado,
      # se pone a 0 EN EL PANEL y se vuelve a 1 al terminar.
      COOKIE_SECURE: ${COOKIE_SECURE:-1}

      PUERTO: "7801"

    volumes:
      # La base y los adjuntos. Esto NO puede faltar: rrhh.db vive aquí y sin
      # volumen se pierde en cada rebuild, junto con los documentos y
      # contratos que haya subido el equipo.
      - rrhh_datos:/app/data

volumes:
  rrhh_datos:
